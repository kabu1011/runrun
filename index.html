<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🪜 萬用自訂隨機爬樓梯系統 (完美隨機版)</title>
    <style>
        :root { --bg: #fdfaf5; --line: #444; --path: #ff4757; }
        body { font-family: sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .box { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 95%; max-width: 1000px; text-align: center; }
        
        .input-group { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .input-item { flex: 1; min-width: 250px; text-align: left; }
        label { font-size: 14px; font-weight: bold; color: #333; display: block; margin-bottom: 8px; }
        textarea { width: 100%; height: 150px; border: 2px solid #ddd; border-radius: 8px; padding: 10px; font-size: 15px; resize: vertical; box-sizing: border-box; line-height: 1.5; }
        
        #game-container { position: relative; margin-top: 30px; width: 100%; height: 680px; display: none; background: #fff; border: 1px solid #eee; border-radius: 10px; }
        .faces-row, .results-row { position: absolute; left: 0; width: 100%; height: 60px; z-index: 10; }
        .faces-row { top: 10px; }
        .results-row { bottom: 10px; }
        
        .node { position: absolute; transform: translateX(-50%); width: 80px; text-align: center; }
        .face-btn { width: 34px; height: 34px; border: 2px solid var(--line); border-radius: 50%; background: white; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; transition: 0.2s; margin: 0 auto; }
        .face-btn:hover { transform: scale(1.2); background: #f0f0f0; }
        .face-btn.used { background: #ddd; cursor: not-allowed; opacity: 0.6; }
        .name-tag { font-size: 12px; display: block; margin-top: 4px; font-weight: bold; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .result-tag { font-size: 13px; font-weight: bold; padding: 6px 10px; border: 2px dashed #ccc; border-radius: 6px; display: inline-block; background: #fff; transition: 0.3s; white-space: nowrap; max-width: 75px; overflow: hidden; text-overflow: ellipsis; }
        .result-tag.active { background: #ff4757; color: white; border-style: solid; border-color: #ff4757; transform: scale(1.15); box-shadow: 0 4px 10px rgba(255,71,87,0.3); }

        svg { position: absolute; top: 70px; left: 0; width: 100%; height: 530px; z-index: 5; }
        .v-line { stroke: #bbb; stroke-width: 2; }
        .h-line { stroke: var(--line); stroke-width: 2; stroke-linecap: round; }
        .trace-path { fill: none; stroke: var(--path); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
        #runner { fill: var(--path); stroke: white; stroke-width: 2; display: none; }

        button#main-btn { background: #6c5ce7; color: white; border: none; padding: 12px 40px; border-radius: 50px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button#main-btn:hover { background: #5b4cc4; box-shadow: 0 4px 15px rgba(108,92,231,0.4); }
    </style>
</head>
<body>

<div class="box">
    <h2>🪜 萬用自訂隨機爬樓梯系統 (完美打亂版)</h2>

    <div class="input-group">
        <div class="input-item">
            <label>🙋‍♂️ 1. 請輸入學生姓名 (每行一個)：</label>
            <textarea id="nameInput" placeholder="請輸入名字，一列一個">同學A&#10;同學B&#10;同學C&#10;同學D&#10;同學E&#10;同學F&#10;同學G&#10;同學H&#10;同學I&#10;同學J</textarea>
        </div>
        <div class="input-item">
            <label>🎁 2. 請輸入下方對應結果 (每行一個)：</label>
            <textarea id="resInput" placeholder="請輸入結果，一列一個">第01題&#10;第02題&#10;第03題&#10;第04題&#10;第05題&#10;第06題&#10;第07題&#10;第08題&#10;第09題&#10;第10題</textarea>
        </div>
    </div>

    <button id="main-btn" onclick="initGame()">產生全新樓梯</button>

    <div id="game-container">
        <div class="faces-row" id="faces"></div>
        <svg id="canvas-svg">
            <circle id="runner" r="7" />
        </svg>
        <div class="results-row" id="results"></div>
    </div>
</div>

<script>
    let config = { lanes: 5, rows: 24, height: 530, width: 0 }; 
    let horizontalBars = [];
    let isRunning = false;

    function initGame() {
        if (isRunning) return;
        
        const names = document.getElementById('nameInput').value.split('\n').map(n => n.trim()).filter(n => n !== "");
        let results = document.getElementById('resInput').value.split('\n').map(r => r.trim()).filter(r => r !== "");
        
        if (names.length < 2) return alert("至少需要輸入 2 個名字喔！");
        if (names.length !== results.length) {
            return alert(`數量不匹配！目前有 ${names.length} 個名字，但有 ${results.length} 個結果。請讓兩邊行數一樣多。`);
        }

        // 【核心修正 1】在分配到各排之前，先將結果陣列進行完美的隨機大洗牌 (Fisher-Yates Shuffle)
        for (let i = results.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [results[i], results[j]] = [results[j], results[i]];
        }

        config.lanes = names.length;
        config.rows = Math.max(20, config.lanes * 4); // 增加層數讓路線更糾結

        const container = document.getElementById('game-container');
        const svg = document.getElementById('canvas-svg');
        container.style.display = 'block';
        
        const runner = document.getElementById('runner');
        svg.innerHTML = '';
        svg.appendChild(runner);
        runner.style.display = 'none';

        document.getElementById('faces').innerHTML = '';
        document.getElementById('results').innerHTML = '';
        horizontalBars = [];

        config.width = svg.clientWidth;
        const stepX = config.width / config.lanes;
        const stepY = config.height / (config.rows + 1);

        // 【核心修正 2】精準橫線生成，禁止連續同位置出現，逼迫紅球大幅度向外擴散
        for (let r = 1; r <= config.rows; r++) {
            for (let l = 0; l < config.lanes - 1; l++) {
                if (Math.random() > 0.45) { 
                    const leftSameRow = horizontalBars.find(b => b.row === r && b.lane === l - 1);
                    const identicalAbove = horizontalBars.find(b => b.row === r - 1 && b.lane === l);
                    
                    // 同一層左右不重疊，且「上一層同位置不能有線」防止無效彈回
                    if (!leftSameRow && !identicalAbove) {
                        horizontalBars.push({ row: r, lane: l });
                    }
                }
            }
        }

        // 渲染畫面
        for (let i = 0; i < config.lanes; i++) {
            const x = (i * stepX) + (stepX / 2);
            svg.appendChild(createSVG('line', { x1: x, y1: 0, x2: x, y2: config.height, class: 'v-line' }));

            const faceDiv = document.createElement('div');
            faceDiv.className = 'node';
            faceDiv.style.left = `${x}px`;
            faceDiv.innerHTML = `<div class="face-btn" id="face-${i}" onclick="startRunning(${i})">🏃</div><span class="name-tag" title="${names[i]}">${names[i]}</span>`;
            document.getElementById('faces').appendChild(faceDiv);

            const resDiv = document.createElement('div');
            resDiv.className = 'node';
            resDiv.style.left = `${x}px`;
            resDiv.innerHTML = `<span class="result-tag" id="res-${i}" title="${results[i]}">${results[i]}</span>`;
            document.getElementById('results').appendChild(resDiv);
        }

        horizontalBars.forEach(bar => {
            const x1 = (bar.lane * stepX) + (stepX / 2);
            const x2 = ((bar.lane + 1) * stepX) + (stepX / 2);
            const y = bar.row * stepY;
            svg.appendChild(createSVG('line', { x1: x1, y1: y, x2: x2, y2: y, class: 'h-line' }));
        });
    }

    function startRunning(startLane) {
        if (isRunning) return;
        const faceBtn = document.getElementById(`face-${startLane}`);
        if (faceBtn.classList.contains('used')) return;

        isRunning = true;
        faceBtn.classList.add('used');
        faceBtn.innerText = "✖";

        const svg = document.getElementById('canvas-svg');
        const runner = document.getElementById('runner');
        const stepX = config.width / config.lanes;
        const stepY = config.height / (config.rows + 1);
        
        const oldPath = document.getElementById('active-path');
        if (oldPath) oldPath.remove();

        let currLane = startLane;
        let points = [[(startLane * stepX) + (stepX / 2), 0]];

        for (let r = 1; r <= config.rows; r++) {
            const y = r * stepY;
            const barRight = horizontalBars.find(b => b.row === r && b.lane === currLane);
            const barLeft = horizontalBars.find(b => b.row === r && b.lane === currLane - 1);

            if (barRight) {
                points.push([(currLane * stepX) + (stepX / 2), y]);
                currLane++;
                points.push([(currLane * stepX) + (stepX / 2), y]);
            } else if (barLeft) {
                points.push([(currLane * stepX) + (stepX / 2), y]);
                currLane--;
                points.push([(currLane * stepX) + (stepX / 2), y]);
            }
        }
        points.push([(currLane * stepX) + (stepX / 2), config.height]);

        const path = createSVG('polyline', {
            points: points.map(p => p.join(',')).join(' '),
            id: 'active-path',
            class: 'trace-path'
        });
        svg.appendChild(path);

        const length = path.getTotalLength();
        path.style.strokeDasharray = length;
        path.style.strokeDashoffset = length;
        
        runner.style.display = 'block';
        let startTime = null;
        const duration = 1600; 

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            let progress = (timestamp - startTime) / duration;
            if (progress > 1) progress = 1;

            const currentLength = length * progress;
            const point = path.getPointAtLength(currentLength);
            
            runner.setAttribute('cx', point.x);
            runner.setAttribute('cy', point.y);
            path.style.strokeDashoffset = length - currentLength;

            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                document.querySelectorAll('.result-tag').forEach(t => t.classList.remove('active'));
                document.getElementById(`res-${currLane}`).classList.add('active');
                isRunning = false;
            }
        }
        requestAnimationFrame(animate);
    }

    function createSVG(tag, attrs) {
        const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (let k in attrs) el.setAttribute(k, attrs[k]);
        return el;
    }

    window.onresize = () => { if(document.getElementById('game-container').style.display === 'block') initGame(); };
</script>

</body>
</html>
